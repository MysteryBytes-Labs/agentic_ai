[project]
name = "agentic-ai-tutorials"
version = "0.1.0"
description = "Agentic AI tutorials and labs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "ollama",
    "gradio",
    "requests",
    "python-dotenv",
    "openai",
    "pypdf",
    "pydantic>=2.0",
    "ipython"
]

[tool.setuptools]
# Prevent setuptools from trying to discover packages at root
py-modules = []

[tool.setuptools.packages.find]
# Don't auto-discover any packages
where = []
